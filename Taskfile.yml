version: '3'

vars:
  APP_NAME: "MineOps"
  APP_VERSION: "1.0.0"
  UPDATE_PUBLIC_KEY_BASE64: '{{.UPDATE_PUBLIC_KEY_BASE64 | default ""}}'
  BIN_DIR: "bin"
  RELEASE_DIR: '{{.RELEASE_DIR | default "dist/release"}}'
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_HOST: '{{.WAILS_VITE_HOST | default "127.0.0.1"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  WAILS_VERSION: "v3.0.0-alpha2.117"
  GOIMPORTS_VERSION: "v0.40.0"
  GOLANGCI_LINT_VERSION: "v2.8.0"
  GOVULNCHECK_VERSION: "v1.1.4"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  bootstrap:
    summary: Installs pinned Go tools and frontend dependencies
    cmds:
      - go install github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}}
      - go install golang.org/x/tools/cmd/goimports@{{.GOIMPORTS_VERSION}}
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
      - task: common:install:frontend:deps

  update:generate-key:
    summary: Generates the free Ed25519 keypair used only for MineOps auto-update authentication
    desc: |
      Generates a self-owned updater keypair with the pinned Wails CLI.
      Keep the private key offline and configure UPDATE_PRIVATE_KEY / UPDATE_PUBLIC_KEY
      in the protected GitHub release environment. No commercial code-signing
      certificate is required for MineOps update verification.
    deps:
      - task: bootstrap
    cmds:
      - mkdir -p "$(dirname "{{.OUTPUT}}")"
      - wails3 updater genkey -out "{{.OUTPUT}}" {{if eq .FORCE "true"}}-force{{end}}
    vars:
      OUTPUT: '{{.OUTPUT | default ".keys/mineops-update.key"}}'

  bindings:
    summary: Regenerates Wails TypeScript bindings
    cmds:
      - task: common:generate:bindings

  spike:sqlcipher:
    summary: Runs the temporary GORM and SQLCipher verification
    cmds:
      - go run ./cmd/sqlcipher-spike

  spike:spark:
    summary: Runs the versioned Minecraft spark capability and parser verification
    cmds:
      - go run ./cmd/spark-spike

  format:
    summary: Formats Go and frontend source files
    cmds:
      - goimports -w main.go $(rg --files internal cmd -g '*.go')
      - pnpm -C frontend run format

  format:check:
    summary: Checks Go and frontend formatting without modifying files
    cmds:
      - |
        unformatted="$(goimports -l main.go $(rg --files internal cmd -g '*.go'))"
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          exit 1
        fi
      - pnpm -C frontend run format:check

  lint:
    summary: Runs Go static analysis and frontend lint/type checks
    cmds:
      - go vet . ./cmd/... ./internal/...
      - golangci-lint run . ./cmd/... ./internal/...
      - pnpm -C frontend run lint
      - pnpm -C frontend run typecheck

  bindings:check:
    summary: Regenerates bindings and checks for tracked differences
    cmds:
      - task: bindings
      - git diff --exit-code -- frontend/bindings
      - test -z "$(git status --porcelain --untracked-files=all -- frontend/bindings)"

  migration:check:
    summary: Enforces versioned Go/GORM migrations without SQL migration files or raw SQL
    cmds:
      - test -z "$(rg --files migrations internal/infrastructure/sqlcipher -g '*.sql' || true)"
      - test -z "$(rg -n '\.(Exec|Raw)\(' internal/infrastructure/sqlcipher -g '*migration*.go' || true)"

  legal:audit:
    summary: Checks release legal files and pnpm production license metadata
    cmds:
      - test -s LICENSE
      - test -s THIRD_PARTY_NOTICES.md
      - |
        pnpm -C frontend licenses list --prod --json | node -e 'let raw="";process.stdin.on("data",chunk=>raw+=chunk);process.stdin.on("end",()=>{const groups=JSON.parse(raw||"{}");const missing=Object.entries(groups).filter(([license])=>/unknown/i.test(license)).flatMap(([,packages])=>packages.map(entry=>entry.name));if(missing.length){console.error(`Missing production frontend license metadata: ${missing.join(", ")}`);process.exit(1);}});'
      - test -z "$(rg -n 'raw.githubusercontent.com/codedgar/Puppertino|puppertino\.css' build frontend --glob '!frontend/node_modules/**' --glob '!frontend/dist/**' || true)"

  version:audit:
    summary: Checks application version consistency across runtime and desktop package metadata
    cmds:
      - rg -q 'ApplicationVersion[[:space:]]*=[[:space:]]*"{{.APP_VERSION}}"' internal/global/constants/constants.go
      - rg -q 'ApplicationUserAgent[[:space:]]*=[[:space:]]*"MineOps/{{.APP_VERSION}}"' internal/global/constants/constants.go
      - |
        for file in build/windows/Taskfile.yml build/darwin/Taskfile.yml build/linux/Taskfile.yml; do
          rg -q -- '-X github.com/Cail-Gainey/MineOps/internal/global/constants.ApplicationVersion=\{\{\.APP_VERSION\}\}' "$file"
          rg -q -- '-X github.com/Cail-Gainey/MineOps/internal/global/constants.ApplicationUserAgent=MineOps/\{\{\.APP_VERSION\}\}' "$file"
          rg -q -- '-X github.com/Cail-Gainey/MineOps/internal/infrastructure/desktoprelease.PublicKeyBase64=\{\{\.UPDATE_PUBLIC_KEY_BASE64\}\}' "$file"
        done
      - rg -q '^[[:space:]]+version:[[:space:]]+"{{.APP_VERSION}}"' build/config.yml
      - rg -q '^version:[[:space:]]+"{{.APP_VERSION}}"' build/linux/nfpm/nfpm.yaml
      - rg -q '"file_version":[[:space:]]+"{{.APP_VERSION}}"' build/windows/info.json
      - rg -q 'INFO_PRODUCTVERSION "{{.APP_VERSION}}"' build/windows/nsis/project.nsi
      - rg -q 'version="{{.APP_VERSION}}\.0"' build/windows/wails.exe.manifest
      - test "$(rg -c '<string>{{.APP_VERSION}}</string>' build/darwin/Info.plist)" -ge 2
      - test "$(rg -c '<string>{{.APP_VERSION}}</string>' build/darwin/Info.dev.plist)" -ge 2

  greenfield:audit:
    summary: Rejects template identifiers, floating versions, databases, and Apache Spark dependencies
    cmds:
      - |
        test -z "$(rg -n 'module changeme|GreetService|Wails \+ Vue' go.mod main.go internal frontend/src frontend/index.html || true)"
      - |
        test -z "$(rg -n '\"[^\"]+\": \"(latest|\^|~)' frontend/package.json || true)"
      - |
        test -z "$(rg --files -g '*.db' -g '*.sqlite' -g '*.sqlite3' | rg . || true)"
      - |
        test -z "$(rg -ni 'apache[-_/ ]spark|hadoop' go.mod go.sum frontend/package.json frontend/pnpm-lock.yaml || true)"

  check:
    summary: Runs reproducible formatting, lint, type, module, and binding checks
    cmds:
      - go mod tidy -diff
      - go -C internal/infrastructure/sqlcipher/driver mod tidy -diff
      - go mod verify
      - task: greenfield:audit
      - task: format:check
      - task: lint
      - task: bindings:check
      - task: migration:check
      - task: legal:audit
      - task: version:audit

  verify:
    summary: Runs checks, vulnerability scanning, and the current-platform desktop build
    cmds:
      - task: check
      - task: spike:sqlcipher
      - task: spike:spark
      - govulncheck . ./cmd/... ./internal/...
      - pnpm -C frontend run audit
      - task: build

  build:
    summary: Builds the current-platform desktop application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  release:clean:
    summary: Removes staged release assets
    cmds:
      - rm -rf "{{.RELEASE_DIR}}"

  release:stage:legal:
    summary: Stages legal materials uploaded with every GitHub Release
    cmds:
      - mkdir -p "{{.RELEASE_DIR}}"
      - cp LICENSE "{{.RELEASE_DIR}}/LICENSE"
      - cp THIRD_PARTY_NOTICES.md "{{.RELEASE_DIR}}/THIRD_PARTY_NOTICES.md"

  release:stage:
    summary: Stages deterministic current-platform release assets
    deps:
      - task: release:stage:legal
    cmds:
      - task: "{{OS}}:release:stage"
        vars:
          APP_VERSION: '{{.APP_VERSION}}'
          ARCH: '{{.ARCH}}'
          RELEASE_DIR: '{{.RELEASE_DIR}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
